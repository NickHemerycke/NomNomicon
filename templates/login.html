{% extends "base.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-r from-yellow-400 via-red-400 to-pink-500">
  <div class="bg-white bg-opacity-90 rounded-lg shadow-lg p-8 w-full max-w-md">
    <h2 class="text-3xl font-extrabold text-center mb-6 text-pink-600">Login</h2>

    <!-- Display flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="mb-4">
          {% for category, message in messages %}
            <div class="p-2 rounded {{ 'bg-red-200 text-red-800' if category == 'error' else 'bg-green-200 text-green-800' }}">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('login') }}" method="POST" class="space-y-6">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" id="email" name="email" required
               class="mt-1 w-full border border-pink-600 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-400">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" name="password" required
               class="mt-1 w-full border border-pink-600 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-400">
      </div>

      <button type="submit"
              class="w-full bg-pink-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-pink-700 focus:outline-none focus:ring-2 focus:ring-pink-400">
        Login
      </button>
    </form>

    <p class="mt-4 text-center text-gray-700">
      Don't have an account yet? 
      <a href="{{ url_for('register') }}" class="text-pink-600 font-semibold hover:underline">Register</a>
    </p>
  </div>
</div>
{% endblock %}
