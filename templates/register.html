{% extends "base.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-r from-yellow-400 via-red-400 to-pink-500">
  <div class="bg-white bg-opacity-90 rounded-lg shadow-lg p-8 w-full max-w-md">
    <h2 class="text-3xl font-extrabold text-center mb-6 text-pink-600">Register</h2>
    <form action="{{ url_for('register') }}" method="POST" class="space-y-6">
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
        <input type="text" id="name" name="name" required
               class="mt-1 w-full border border-pink-600 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-400">
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" id="email" name="email" required
               class="mt-1 w-full border border-pink-600 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-400">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="password" name="password" required
               class="mt-1 w-full border border-pink-600 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-pink-400">
      </div>

      <button type="submit"
              class="w-full bg-pink-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-pink-700 focus:outline-none focus:ring-2 focus:ring-pink-400">
        Register
      </button>
    </form>

    <!-- Link to login if user already has an account -->
    <p class="mt-4 text-center text-gray-700">
      Already have an account? 
      <a href="{{ url_for('login') }}" class="text-pink-600 font-semibold hover:underline">Login</a>
    </p>
  </div>
</div>
{% endblock %}
