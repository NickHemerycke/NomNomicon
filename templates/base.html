<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NomNomicon{% endblock %}</title>
    <!-- Tailwind JIT via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">

<nav class="bg-white shadow-md p-4">
  <div class="container mx-auto flex justify-between items-center">
      <a href="/" class="text-xl font-bold text-indigo-600">NomNomicon</a>
      <div>
          <a href="/" class="text-gray-700 hover:text-indigo-600 mx-2">Recipes</a>
          <a href="/menu" class="text-gray-700 hover:text-indigo-600 mx-2">Menu</a>
          <a href="/list" class="text-gray-700 hover:text-indigo-600 mx-2">Grocery List</a>
      </div>
  </div>
</nav>

{% block content %}{% endblock %}

<footer class="bg-white shadow-md p-4 mt-8">
    <div class="container mx-auto text-center text-gray-600">
        &copy; 2025 NomNomicon. All rights reserved. Powered by Hevan.EU
    </div>
</footer>

</body>
</html>
